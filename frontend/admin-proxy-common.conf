auth_request /_admin_proxy_auth;

proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Prefix $admin_prefix;
proxy_set_header Accept-Encoding "";

# External admin tools are embedded by ToolHub on the same origin. Strip any
# upstream anti-framing policy and replace it with a same-origin-only policy.
proxy_hide_header X-Frame-Options;
proxy_hide_header Content-Security-Policy;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
add_header Cache-Control "no-store" always;

proxy_read_timeout 10m;
proxy_send_timeout 10m;
proxy_buffering off;
gunzip on;

proxy_redirect ~^(/.*)$ $admin_prefix$1;
proxy_cookie_path / $admin_prefix/;
