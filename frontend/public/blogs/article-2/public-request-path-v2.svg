<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Public request path and trust boundaries</title>
  <desc id="desc">A browser connects over HTTPS to Cloudflare and a public VPS. Caddy optionally asks a localhost authentication gateway, then sends HTTP through an encrypted WireGuard tunnel to a Raspberry Pi service on the home LAN.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#10182a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="tunnel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="1360" cy="120" r="260" fill="#7c3aed" opacity="0.07"/>
  <circle cx="190" cy="790" r="280" fill="#0ea5e9" opacity="0.06"/>

  <text x="82" y="92" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="700">The public edge stops at the VPS</text>
  <text x="82" y="137" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="23">Selected traffic reaches one Pi tunnel address; application ports stay off the home router.</text>

  <rect x="66" y="188" width="515" height="520" rx="28" fill="#0b1220" stroke="#334155" stroke-width="2" stroke-dasharray="10 10"/>
  <text x="96" y="228" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">PUBLIC INTERNET</text>

  <rect x="612" y="188" width="500" height="520" rx="28" fill="#16112b" stroke="#a78bfa" stroke-width="3"/>
  <text x="642" y="228" fill="#ddd6fe" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">PUBLIC / VPS TRUST BOUNDARY</text>

  <rect x="1143" y="188" width="391" height="520" rx="28" fill="#071c1c" stroke="#2dd4bf" stroke-width="3"/>
  <text x="1173" y="228" fill="#99f6e4" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">HOME-LAN TRUST BOUNDARY</text>

  <g filter="url(#shadow)">
    <rect x="100" y="332" width="190" height="190" rx="24" fill="#111827" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="195" cy="389" r="28" fill="#1e293b" stroke="#60a5fa" stroke-width="3"/>
    <path d="M177 390h36M195 372c-11 12-11 24 0 36M195 372c11 12 11 24 0 36" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
    <text x="195" y="459" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700">Browser</text>
    <text x="195" y="491" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="17">Normal public URL</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="350" y="332" width="195" height="190" rx="24" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
    <path d="M412 383c10-21 46-21 60 0 21-7 38 10 34 30-3 16-16 22-32 22h-65c-15 0-27-10-27-24 0-16 13-28 30-28z" fill="#f59e0b" opacity="0.22" stroke="#fbbf24" stroke-width="3"/>
    <text x="447" y="464" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="700">Cloudflare</text>
    <text x="447" y="493" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="16">DNS or proxy</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="660" y="286" width="404" height="282" rx="28" fill="url(#edge)" stroke="#c4b5fd" stroke-width="2"/>
    <text x="862" y="342" text-anchor="middle" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="29" font-weight="750">VPS · 10.90.0.1</text>
    <rect x="696" y="378" width="154" height="112" rx="18" fill="#111827" opacity="0.72"/>
    <text x="773" y="425" text-anchor="middle" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700">Caddy</text>
    <text x="773" y="455" text-anchor="middle" fill="#ddd6fe" font-family="Inter, system-ui, sans-serif" font-size="15">TLS + routing</text>
    <rect x="874" y="378" width="154" height="112" rx="18" fill="#111827" opacity="0.72"/>
    <text x="951" y="418" text-anchor="middle" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="700">Auth</text>
    <text x="951" y="446" text-anchor="middle" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="700">gateway</text>
    <text x="951" y="472" text-anchor="middle" fill="#ddd6fe" font-family="Inter, system-ui, sans-serif" font-size="14">selected hosts</text>
    <path d="M850 434H866" stroke="#f9a8d4" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="862" y="526" text-anchor="middle" fill="#fbcfe8" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="650">localhost :8082</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1200" y="332" width="278" height="190" rx="24" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
    <rect x="1288" y="371" width="102" height="66" rx="10" fill="#0f766e" opacity="0.65" stroke="#5eead4" stroke-width="2"/>
    <circle cx="1310" cy="457" r="5" fill="#22c55e"/>
    <circle cx="1328" cy="457" r="5" fill="#38bdf8"/>
    <text x="1339" y="488" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="700">Pi service</text>
    <text x="1339" y="513" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="16">10.90.0.2 · container</text>
  </g>

  <path d="M290 427H340" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="315" y="403" text-anchor="middle" fill="#bfdbfe" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="650">HTTPS</text>
  <path d="M545 427H650" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="598" y="403" text-anchor="middle" fill="#bfdbfe" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="650">HTTPS</text>
  <path d="M1064 427H1190" stroke="url(#tunnel)" stroke-width="7" marker-end="url(#arrow)"/>
  <text x="1127" y="386" text-anchor="middle" fill="#7dd3fc" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">WireGuard</text>
  <text x="1127" y="408" text-anchor="middle" fill="#86efac" font-family="Inter, system-ui, sans-serif" font-size="14">HTTP inside tunnel</text>

  <rect x="102" y="605" width="443" height="70" rx="18" fill="#111827" stroke="#1e293b" stroke-width="2"/>
  <text x="323" y="635" text-anchor="middle" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700">Public address is Cloudflare or the VPS</text>
  <text x="323" y="660" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="15">Never the residential address</text>

  <rect x="1177" y="605" width="323" height="70" rx="18" fill="#0b1220" stroke="#134e4a" stroke-width="2"/>
  <text x="1339" y="635" text-anchor="middle" fill="#ccfbf1" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700">No router application forwards</text>
  <text x="1339" y="660" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="15">LAN paths remain independent</text>

  <text x="82" y="805" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">Layer responsibilities</text>
  <text x="82" y="841" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="17">TLS protects the browser connection · WireGuard protects the machine-to-machine hop · Application auth decides what a user may do</text>
  <text x="1518" y="856" text-anchor="end" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="16">hostingfrompurva.xyz · Part 2</text>
</svg>
