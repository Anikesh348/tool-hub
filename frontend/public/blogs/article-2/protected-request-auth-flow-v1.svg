<svg xmlns="http://www.w3.org/2000/svg" width="900" height="980" viewBox="0 0 900 980" role="img" aria-labelledby="title desc">
  <title id="title">Protected request authentication flow on the VPS</title>
  <desc id="desc">A browser sends a metrics request to Caddy on the VPS. Caddy holds the original request and asks the authentication gateway over localhost. A rejected request returns a login redirect or 401 response. An allowed request returns to Caddy and continues through WireGuard to the metrics service on the Raspberry Pi.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#111a2d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.34"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#34d399"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#fb7185"/>
    </marker>
  </defs>

  <rect width="900" height="980" rx="32" fill="url(#bg)"/>
  <circle cx="790" cy="80" r="210" fill="#7c3aed" opacity="0.08"/>
  <circle cx="95" cy="900" r="220" fill="#0ea5e9" opacity="0.06"/>

  <text x="58" y="72" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="39" font-weight="700">How a protected request is checked</text>
  <text x="58" y="112" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="20">metrics.hostingfrompurva.xyz</text>

  <g filter="url(#shadow)">
    <rect x="150" y="160" width="600" height="92" rx="22" fill="#111827" stroke="#60a5fa" stroke-width="2"/>
    <text x="195" y="197" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700">Browser request</text>
    <text x="195" y="229" fill="#93c5fd" font-family="Inter, system-ui, sans-serif" font-size="18">GET https://metrics.hostingfrompurva.xyz</text>
  </g>

  <path d="M450 252V290" stroke="#94a3b8" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="70" y="300" width="760" height="405" rx="28" fill="#15102a" stroke="#a78bfa" stroke-width="3"/>
  <text x="100" y="340" fill="#ddd6fe" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">PUBLIC VPS BOUNDARY</text>

  <g filter="url(#shadow)">
    <rect x="135" y="370" width="630" height="100" rx="22" fill="url(#edge)" stroke="#c4b5fd" stroke-width="2"/>
    <text x="180" y="409" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700">Caddy holds the original request</text>
    <text x="180" y="443" fill="#ede9fe" font-family="Inter, system-ui, sans-serif" font-size="18">forward_auth asks before reverse_proxy runs</text>
  </g>

  <path d="M450 470V508" stroke="#f472b6" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="474" y="498" fill="#f9a8d4" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">LOCALHOST CHECK</text>

  <g filter="url(#shadow)">
    <rect x="180" y="518" width="540" height="92" rx="22" fill="#281127" stroke="#f472b6" stroke-width="2"/>
    <text x="225" y="556" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700">Authentication gateway</text>
    <text x="225" y="588" fill="#fbcfe8" font-family="Inter, system-ui, sans-serif" font-size="18">checks session, hostname and account policy</text>
  </g>

  <path d="M330 610V650" stroke="#fb7185" stroke-width="5" marker-end="url(#redArrow)"/>
  <path d="M570 610V650" stroke="#34d399" stroke-width="5" marker-end="url(#greenArrow)"/>

  <rect x="115" y="658" width="300" height="76" rx="20" fill="#310b17" stroke="#fb7185" stroke-width="2"/>
  <text x="265" y="691" text-anchor="middle" fill="#fecdd3" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700">REJECT</text>
  <text x="265" y="718" text-anchor="middle" fill="#fda4af" font-family="Inter, system-ui, sans-serif" font-size="17">login redirect or 401</text>

  <rect x="485" y="658" width="300" height="76" rx="20" fill="#09251f" stroke="#34d399" stroke-width="2"/>
  <text x="635" y="691" text-anchor="middle" fill="#d1fae5" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700">ALLOW</text>
  <text x="635" y="718" text-anchor="middle" fill="#6ee7b7" font-family="Inter, system-ui, sans-serif" font-size="17">Caddy resumes the request</text>

  <path d="M635 734V782" stroke="#34d399" stroke-width="6" marker-end="url(#greenArrow)"/>
  <text x="660" y="769" fill="#7dd3fc" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">WIREGUARD</text>

  <g filter="url(#shadow)">
    <rect x="220" y="792" width="560" height="100" rx="22" fill="#09251f" stroke="#34d399" stroke-width="2"/>
    <text x="265" y="831" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700">Metrics service on the Pi</text>
    <text x="265" y="865" fill="#6ee7b7" font-family="Inter, system-ui, sans-serif" font-size="18">only the allowed request reaches this application</text>
  </g>

  <path d="M115 696C68 696 68 206 140 206" fill="none" stroke="#fb7185" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#redArrow)"/>

  <text x="58" y="940" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="17">The gateway and Caddy communicate locally; rejected traffic never crosses the tunnel</text>
</svg>
