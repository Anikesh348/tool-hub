<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Public request path to the Raspberry Pi homelab</title>
  <desc id="desc">A browser reaches Cloudflare DNS, a public VPS running Caddy, an optional authentication decision, a WireGuard tunnel, and finally a service on the Raspberry Pi.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#10182a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="tunnel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="1340" cy="130" r="250" fill="#7c3aed" opacity="0.07"/>
  <circle cx="210" cy="780" r="280" fill="#0ea5e9" opacity="0.06"/>

  <text x="90" y="105" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="700">A public URL, without a public home router</text>
  <text x="90" y="150" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="23">Each boundary has one job; the Pi remains behind the WireGuard tunnel.</text>

  <g filter="url(#shadow)">
    <rect x="75" y="300" width="230" height="190" rx="26" fill="#111827" stroke="#334155" stroke-width="2"/>
    <circle cx="190" cy="355" r="28" fill="#1e293b" stroke="#60a5fa" stroke-width="3"/>
    <path d="M172 356h36M190 338c-11 12-11 24 0 36M190 338c11 12 11 24 0 36" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
    <text x="190" y="425" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700">Browser</text>
    <text x="190" y="458" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="18">Normal HTTPS URL</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="380" y="300" width="250" height="190" rx="26" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
    <path d="M468 350c12-24 56-24 72 0 25-8 45 12 40 35-4 19-19 26-38 26h-78c-18 0-32-12-32-29 0-18 15-32 36-32z" fill="#f59e0b" opacity="0.22" stroke="#fbbf24" stroke-width="3"/>
    <text x="505" y="425" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700">Cloudflare DNS</text>
    <text x="505" y="458" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="18">Names the public edge</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="705" y="245" width="300" height="300" rx="30" fill="url(#edge)" stroke="#a78bfa" stroke-width="2"/>
    <rect x="790" y="295" width="130" height="78" rx="14" fill="#111827" opacity="0.72"/>
    <circle cx="815" cy="320" r="5" fill="#22c55e"/>
    <circle cx="835" cy="320" r="5" fill="#38bdf8"/>
    <path d="M815 344h80" stroke="#c4b5fd" stroke-width="5" stroke-linecap="round"/>
    <text x="855" y="425" text-anchor="middle" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="29" font-weight="750">VPS + Caddy</text>
    <text x="855" y="461" text-anchor="middle" fill="#ede9fe" font-family="Inter, system-ui, sans-serif" font-size="19">HTTPS · routing · proxy</text>
    <rect x="754" y="486" width="202" height="34" rx="17" fill="#111827" opacity="0.42"/>
    <text x="855" y="509" text-anchor="middle" fill="#f5f3ff" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="650">PUBLIC BOUNDARY</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1080" y="300" width="210" height="190" rx="26" fill="#111827" stroke="#22c55e" stroke-width="2"/>
    <path d="M1160 340v-12c0-23 16-39 35-39s35 16 35 39v12" transform="translate(-10 28)" fill="none" stroke="#4ade80" stroke-width="7" stroke-linecap="round"/>
    <rect x="1139" y="363" width="72" height="52" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="3"/>
    <circle cx="1175" cy="387" r="7" fill="#bbf7d0"/>
    <text x="1185" y="438" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="700">WireGuard</text>
    <text x="1185" y="467" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="17">Encrypted private hop</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1365" y="300" width="175" height="190" rx="26" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
    <rect x="1410" y="338" width="86" height="62" rx="10" fill="#0f766e" opacity="0.65" stroke="#5eead4" stroke-width="2"/>
    <circle cx="1430" cy="420" r="5" fill="#22c55e"/>
    <circle cx="1448" cy="420" r="5" fill="#ef4444"/>
    <text x="1452" y="453" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="700">Pi service</text>
    <text x="1452" y="478" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="16">Container + data</text>
  </g>

  <path d="M305 395H370" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M630 395H695" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1005 395H1070" stroke="url(#tunnel)" stroke-width="7" marker-end="url(#arrow)"/>
  <path d="M1290 395H1355" stroke="url(#tunnel)" stroke-width="7" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="720" y="640" width="270" height="122" rx="24" fill="#111827" stroke="#f472b6" stroke-width="2"/>
    <circle cx="772" cy="700" r="25" fill="#831843" opacity="0.7"/>
    <path d="M762 700l8 8 15-18" fill="none" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="882" y="692" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="700">Auth gateway</text>
    <text x="882" y="724" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="17">Selected hostnames only</text>
  </g>
  <path d="M855 545V628" stroke="#f472b6" stroke-width="4" stroke-dasharray="9 10" marker-end="url(#arrow)"/>

  <rect x="1088" y="610" width="430" height="170" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
  <text x="1120" y="655" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">What is not public</text>
  <text x="1120" y="696" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="18">• Raspberry Pi home address</text>
  <text x="1120" y="731" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="18">• Individual application ports on the router</text>
  <text x="1120" y="766" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="18">• Private LAN-only services</text>

  <text x="90" y="835" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="17">hostingfrompurva.xyz · Part 2 · simplified request path</text>
</svg>
