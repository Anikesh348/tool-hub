<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000" role="img" aria-labelledby="title desc">
  <title id="title">Journey of a production blog request</title>
  <desc id="desc">A browser requests an article at hostingfrompurva.xyz. Cloudflare DNS returns the public VPS address. The browser establishes HTTPS with Caddy, which matches the production hostname and sends the request through WireGuard to ToolHub on the Raspberry Pi. The article response returns through the same path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#111a2d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.34"/>
    </filter>
    <marker id="downArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#34d399"/>
    </marker>
    <marker id="upArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#60a5fa"/>
    </marker>
  </defs>

  <rect width="900" height="1000" rx="32" fill="url(#bg)"/>
  <circle cx="790" cy="80" r="210" fill="#7c3aed" opacity="0.08"/>
  <circle cx="100" cy="930" r="230" fill="#0ea5e9" opacity="0.06"/>

  <text x="60" y="72" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="700">Journey of a production blog request</text>
  <text x="60" y="112" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="20">hostingfrompurva.xyz/blogs/&lt;article-name&gt;</text>

  <rect x="50" y="150" width="800" height="760" rx="28" fill="#0b1220" stroke="#273449" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="110" y="190" width="610" height="100" rx="22" fill="#111827" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="165" cy="240" r="27" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <text x="165" y="248" text-anchor="middle" fill="#bfdbfe" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700">1</text>
    <text x="215" y="228" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700">Browser</text>
    <text x="215" y="261" fill="#93c5fd" font-family="Inter, system-ui, sans-serif" font-size="18">opens the published article over HTTPS</text>
  </g>

  <path d="M415 290V327" stroke="#34d399" stroke-width="5" marker-end="url(#downArrow)"/>
  <text x="438" y="316" fill="#6ee7b7" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">REQUEST</text>

  <g filter="url(#shadow)">
    <rect x="110" y="337" width="610" height="100" rx="22" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="165" cy="387" r="27" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
    <text x="165" y="395" text-anchor="middle" fill="#fde68a" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700">2</text>
    <text x="215" y="375" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700">Cloudflare DNS</text>
    <text x="215" y="408" fill="#fbbf24" font-family="Inter, system-ui, sans-serif" font-size="18">returns the public VPS address</text>
  </g>

  <path d="M415 437V474" stroke="#34d399" stroke-width="5" marker-end="url(#downArrow)"/>

  <g filter="url(#shadow)">
    <rect x="110" y="484" width="610" height="100" rx="22" fill="url(#edge)" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="165" cy="534" r="27" fill="#312e81" stroke="#c4b5fd" stroke-width="2"/>
    <text x="165" y="542" text-anchor="middle" fill="#ede9fe" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700">3</text>
    <text x="215" y="522" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700">Caddy on the VPS</text>
    <text x="215" y="555" fill="#ede9fe" font-family="Inter, system-ui, sans-serif" font-size="18">accepts HTTPS and matches the production hostname</text>
  </g>

  <path d="M415 584V621" stroke="#34d399" stroke-width="5" marker-end="url(#downArrow)"/>

  <g filter="url(#shadow)">
    <rect x="110" y="631" width="610" height="100" rx="22" fill="#0c2630" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="165" cy="681" r="27" fill="#082f49" stroke="#38bdf8" stroke-width="2"/>
    <text x="165" y="689" text-anchor="middle" fill="#bae6fd" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700">4</text>
    <text x="215" y="669" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700">WireGuard tunnel</text>
    <text x="215" y="702" fill="#7dd3fc" font-family="Inter, system-ui, sans-serif" font-size="18">carries the private request from VPS to Pi</text>
  </g>

  <path d="M415 731V768" stroke="#34d399" stroke-width="5" marker-end="url(#downArrow)"/>

  <g filter="url(#shadow)">
    <rect x="110" y="778" width="610" height="100" rx="22" fill="#09251f" stroke="#34d399" stroke-width="2"/>
    <circle cx="165" cy="828" r="27" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <text x="165" y="836" text-anchor="middle" fill="#a7f3d0" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700">5</text>
    <text x="215" y="816" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700">ToolHub on the Pi</text>
    <text x="215" y="849" fill="#6ee7b7" font-family="Inter, system-ui, sans-serif" font-size="18">serves the published article response</text>
  </g>

  <path d="M760 828C815 828 815 240 730 240" fill="none" stroke="#60a5fa" stroke-width="5" stroke-dasharray="10 9" marker-end="url(#upArrow)"/>
  <rect x="739" y="476" width="88" height="118" rx="22" fill="#0f1c34" stroke="#1e3a5f" stroke-width="2"/>
  <text x="783" y="515" text-anchor="middle" fill="#93c5fd" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">ARTICLE</text>
  <text x="783" y="539" text-anchor="middle" fill="#93c5fd" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">RESPONSE</text>
  <text x="783" y="570" text-anchor="middle" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="14">same path</text>

  <text x="60" y="955" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="17">The production hostname points to the VPS, not the home connection</text>
</svg>
