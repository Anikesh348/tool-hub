<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">The real request paths for the dev blog and protected metrics</title>
  <desc id="desc">The dev blog travels from a browser through Cloudflare and Caddy, then over WireGuard to ToolHub on the Pi. The metrics hostname follows the same public path but pauses at the authentication gateway; allowed requests continue and rejected requests stop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#111a2d"/>
    </linearGradient>
    <linearGradient id="vps" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="900" height="1200" rx="32" fill="url(#bg)"/>
  <circle cx="790" cy="90" r="210" fill="#7c3aed" opacity="0.08"/>
  <circle cx="95" cy="1110" r="230" fill="#0ea5e9" opacity="0.06"/>

  <text x="60" y="72" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="39" font-weight="700">Two hostnames, one front door</text>
  <text x="60" y="112" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="20">The protected route pauses for one extra decision.</text>

  <rect x="44" y="148" width="812" height="462" rx="26" fill="#0b1220" stroke="#273449" stroke-width="2"/>
  <rect x="70" y="172" width="610" height="48" rx="24" fill="#172554"/>
  <text x="94" y="204" fill="#bfdbfe" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">THIS ARTICLE · dev.hostingfrompurva.xyz</text>

  <g filter="url(#shadow)">
    <rect x="120" y="250" width="660" height="66" rx="18" fill="#111827" stroke="#60a5fa" stroke-width="2"/>
    <text x="155" y="291" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700">1 · Browser</text>
    <text x="745" y="291" text-anchor="end" fill="#93c5fd" font-family="Inter, system-ui, sans-serif" font-size="18">opens the HTTPS URL</text>
  </g>
  <path d="M450 316V339" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="120" y="347" width="660" height="66" rx="18" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
    <text x="155" y="388" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700">2 · Cloudflare</text>
    <text x="745" y="388" text-anchor="end" fill="#fbbf24" font-family="Inter, system-ui, sans-serif" font-size="18">DNS + HTTPS proxy</text>
  </g>
  <path d="M450 413V436" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="120" y="444" width="660" height="66" rx="18" fill="url(#vps)" stroke="#c4b5fd" stroke-width="2"/>
    <text x="155" y="485" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700">3 · Caddy on the VPS</text>
    <text x="745" y="485" text-anchor="end" fill="#ede9fe" font-family="Inter, system-ui, sans-serif" font-size="18">matches the hostname</text>
  </g>
  <path d="M450 510V533" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="120" y="541" width="660" height="46" rx="16" fill="#09251f" stroke="#34d399" stroke-width="2"/>
    <text x="155" y="572" fill="#d1fae5" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700">4 · WireGuard → ToolHub dev on the Pi → article response</text>
  </g>

  <rect x="44" y="642" width="812" height="470" rx="26" fill="#0b1220" stroke="#273449" stroke-width="2"/>
  <rect x="70" y="666" width="660" height="48" rx="24" fill="#3b1631"/>
  <text x="94" y="698" fill="#fbcfe8" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">PROTECTED TOOL · metrics.hostingfrompurva.xyz</text>

  <g filter="url(#shadow)">
    <rect x="120" y="744" width="660" height="66" rx="18" fill="#111827" stroke="#60a5fa" stroke-width="2"/>
    <text x="155" y="785" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700">1 · Browser + Cloudflare</text>
    <text x="745" y="785" text-anchor="end" fill="#93c5fd" font-family="Inter, system-ui, sans-serif" font-size="18">same public path</text>
  </g>
  <path d="M450 810V833" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="120" y="841" width="660" height="66" rx="18" fill="url(#vps)" stroke="#c4b5fd" stroke-width="2"/>
    <text x="155" y="882" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700">2 · Caddy on the VPS</text>
    <text x="745" y="882" text-anchor="end" fill="#ede9fe" font-family="Inter, system-ui, sans-serif" font-size="18">asks before routing</text>
  </g>
  <path d="M450 907V930" stroke="#f472b6" stroke-width="5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="120" y="938" width="660" height="66" rx="18" fill="#281127" stroke="#f472b6" stroke-width="2"/>
    <text x="155" y="979" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700">3 · Auth gateway</text>
    <text x="745" y="979" text-anchor="end" fill="#fbcfe8" font-family="Inter, system-ui, sans-serif" font-size="18">checks account policy</text>
  </g>
  <path d="M325 1004V1027" stroke="#34d399" stroke-width="5" marker-end="url(#greenArrow)"/>
  <path d="M575 1004V1027" stroke="#fb7185" stroke-width="5" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="120" y="1035" width="390" height="54" rx="17" fill="#09251f" stroke="#34d399" stroke-width="2"/>
    <text x="315" y="1070" text-anchor="middle" fill="#d1fae5" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">ALLOW → WireGuard → metrics on Pi</text>
    <rect x="530" y="1035" width="250" height="54" rx="17" fill="#310b17" stroke="#fb7185" stroke-width="2"/>
    <text x="655" y="1070" text-anchor="middle" fill="#fecdd3" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">STOP → login or 401</text>
  </g>

  <text x="60" y="1160" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="17">Simplified from the active Caddy routes · applications remain on the Raspberry Pi</text>
</svg>
