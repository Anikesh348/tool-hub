<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MovieHub request and playback path</title>
  <desc id="desc">A user searches and requests media in MovieHub. An admin approves it, Radarr or Sonarr coordinates the download, the file enters the SSD library, and Jellyfin serves it to the user's device.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <text x="90" y="105" fill="#f8fafc" font-family="Inter,system-ui,sans-serif" font-size="42" font-weight="700">One request, several clear boundaries</text>
  <text x="90" y="152" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="22">MovieHub manages people and state; the media stack handles files and playback.</text>

  <g fill="none" stroke="#94a3b8" stroke-width="6" marker-end="url(#arrow)">
    <path d="M315 330H430"/>
    <path d="M690 330H805"/>
    <path d="M1065 330H1180"/>
    <path d="M1310 430V560"/>
    <path d="M1180 670H1065"/>
    <path d="M805 670H690"/>
    <path d="M430 670H315"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter,system-ui,sans-serif">
    <g transform="translate(90 250)">
      <rect width="225" height="160" rx="24" fill="#172554" stroke="#3b82f6" stroke-width="3"/>
      <circle cx="112" cy="50" r="25" fill="#60a5fa"/>
      <path d="M72 118c8-26 72-26 80 0" fill="none" stroke="#dbeafe" stroke-width="12" stroke-linecap="round"/>
      <text x="112" y="147" text-anchor="middle" fill="#eff6ff" font-size="24" font-weight="650">User requests</text>
    </g>
    <g transform="translate(430 250)">
      <rect width="260" height="160" rx="24" fill="#134e4a" stroke="#14b8a6" stroke-width="3"/>
      <rect x="70" y="35" width="120" height="58" rx="13" fill="#5eead4" opacity=".9"/>
      <path d="M94 64h72M110 79h40" stroke="#134e4a" stroke-width="7" stroke-linecap="round"/>
      <text x="130" y="139" text-anchor="middle" fill="#f0fdfa" font-size="24" font-weight="650">MovieHub</text>
    </g>
    <g transform="translate(805 250)">
      <rect width="260" height="160" rx="24" fill="#3b0764" stroke="#a855f7" stroke-width="3"/>
      <circle cx="130" cy="62" r="35" fill="#c084fc"/>
      <path d="M112 63l13 13 26-30" fill="none" stroke="#3b0764" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="130" y="139" text-anchor="middle" fill="#faf5ff" font-size="24" font-weight="650">Admin approves</text>
    </g>
    <g transform="translate(1180 250)">
      <rect width="260" height="180" rx="24" fill="#422006" stroke="#f59e0b" stroke-width="3"/>
      <path d="M65 48h130M65 77h95M65 106h115" stroke="#fbbf24" stroke-width="11" stroke-linecap="round"/>
      <text x="130" y="145" text-anchor="middle" fill="#fffbeb" font-size="22" font-weight="650">Radarr / Sonarr</text>
      <text x="130" y="169" text-anchor="middle" fill="#fde68a" font-size="16">search and organize</text>
    </g>
    <g transform="translate(1180 560)">
      <rect width="260" height="180" rx="24" fill="#3f1d2e" stroke="#f43f5e" stroke-width="3"/>
      <path d="M130 38v72m-28-25 28 28 28-28" fill="none" stroke="#fb7185" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="130" y="145" text-anchor="middle" fill="#fff1f2" font-size="22" font-weight="650">Download client</text>
      <text x="130" y="169" text-anchor="middle" fill="#fecdd3" font-size="16">queue and transfer</text>
    </g>
    <g transform="translate(805 590)">
      <rect width="260" height="160" rx="24" fill="#312e1b" stroke="#eab308" stroke-width="3"/>
      <rect x="62" y="38" width="136" height="65" rx="16" fill="#fde047"/>
      <circle cx="174" cy="70" r="8" fill="#713f12"/>
      <text x="130" y="139" text-anchor="middle" fill="#fefce8" font-size="24" font-weight="650">SSD library</text>
    </g>
    <g transform="translate(430 590)">
      <rect width="260" height="160" rx="24" fill="#2e1065" stroke="#8b5cf6" stroke-width="3"/>
      <rect x="59" y="31" width="142" height="80" rx="12" fill="#a78bfa"/>
      <path d="M112 51l45 20-45 20Z" fill="#2e1065"/>
      <text x="130" y="139" text-anchor="middle" fill="#f5f3ff" font-size="24" font-weight="650">Jellyfin</text>
    </g>
    <g transform="translate(90 590)">
      <rect width="225" height="160" rx="24" fill="#172554" stroke="#3b82f6" stroke-width="3"/>
      <rect x="60" y="31" width="105" height="72" rx="10" fill="#60a5fa"/>
      <path d="M101 49l39 18-39 18Z" fill="#172554"/>
      <text x="112" y="139" text-anchor="middle" fill="#eff6ff" font-size="24" font-weight="650">Watch</text>
    </g>
  </g>

  <rect x="90" y="806" width="1420" height="4" rx="2" fill="url(#accent)"/>
  <text x="90" y="850" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="17">hostingfrompurva.xyz · Part 3 · simplified media request path</text>
</svg>
