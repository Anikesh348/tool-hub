auth_request /_admin_proxy_auth;

proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Prefix $admin_prefix;
proxy_set_header Accept-Encoding "";

# External admin tools are embedded by ToolHub on the same origin. Strip any
# upstream anti-framing policy and replace it with a same-origin-only policy.
proxy_hide_header X-Frame-Options;
proxy_hide_header Content-Security-Policy;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
add_header Cache-Control "no-store" always;

proxy_read_timeout 10m;
proxy_send_timeout 10m;
proxy_buffering off;
gunzip on;

# Servarr is configured at / for direct LAN access. Rewrite only declarative
# asset paths and bootstrap metadata for the ToolHub subpath. Do not rewrite
# JavaScript: doing so corrupts API paths and router-library string constants.
sub_filter_once off;
sub_filter_types text/css application/json application/manifest+json;
sub_filter '="/' '="$admin_prefix/';
sub_filter 'url(/' 'url($admin_prefix/';
sub_filter "urlBase: ''" "urlBase: '$admin_prefix'";
sub_filter '"apiRoot": "/api/' '"apiRoot": "$admin_prefix/api/';
sub_filter '"urlBase": ""' '"urlBase": "$admin_prefix"';

# The upstream app serves its native root for direct LAN access. ToolHub adds
# the iframe prefix at this proxy boundary only. Keep the upstream auth cookie
# at / so bootstrap requests can authenticate through the same origin.
proxy_redirect ~^(/.*)$ $admin_prefix$1;
