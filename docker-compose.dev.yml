services:
  frontend-dev:
    image: tool-hub-frontend-dev:latest
    container_name: toolhub-dev-frontend
    command:
      - /bin/sh
      - -ec
      - |
        sed -i \
          -e 's|http://backend:8080|http://backend-dev:8080|g' \
          -e 's|http://route-metrics-grafana:3000|http://host.docker.internal:4300|g' \
          /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    ports:
      - "3100:3000"
    depends_on:
      backend-dev:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend/public/blogs/article-2:/usr/share/nginx/html/blogs/article-2:ro
    restart: unless-stopped
    cpus: "0.15"
    mem_limit: 96m
    pids_limit: 64
    networks:
      - dev

  backend-dev:
    image: tool-hub-backend-dev:latest
    container_name: toolhub-dev-backend
    env_file:
      - ./backend/.env.dev
    environment:
      BLOG_DB_NAME: toolhub_blogs_dev
      TOOLHUB_SCHEDULER_ENABLED: "false"
      SCRAPPER_SEARCH_URL: http://scraper-beautifulsoup:8001/v2/search
      TOOLHUB_AUTH_URL: http://toolhub-auth:8080
      REDIS_URL: redis://toolhub-redis:6379/1
      GATUS_URL: http://gatus:8082
    volumes:
      - buzzwatch-data:/data/buzzwatch
      - /run/toolhub-admin:/run/toolhub-admin:ro
      - /srv/docker/apps/route-observability/metrics-token:/run/secrets/toolhub_metrics_token:ro
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 320m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - dev
      - production

volumes:
  buzzwatch-data:
    external: true
    name: tool-hub_buzzwatch-data

networks:
  dev:
  production:
    external: true
    name: tool-hub_default
