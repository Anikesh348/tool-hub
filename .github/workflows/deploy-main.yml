name: Manual Deploy ToolHub (Docker Build + Up)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to deploy"
        required: true
        default: "main"
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: toolhub-manual-deploy
      cancel-in-progress: false

    steps:
      - name: 🧩 Join Tailscale tailnet
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: gha-deploy-toolhub

      - name: 🔍 Verify Tailscale connectivity
        run: |
          echo "== Tailscale status =="
          tailscale status
          echo ""
          echo "== Tailscale IPs =="
          tailscale ip
          echo ""
          echo "== Ping Pi over tailnet =="
          ping -c 3 ${{ secrets.PI_HOST }}

      - name: 🚀 Deploy on Raspberry Pi
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          script: |
            set -euxo pipefail

            DEPLOY_BRANCH="${{ github.event.inputs.branch }}"
            echo "🌿 Branch selected for deploy: ${DEPLOY_BRANCH}"

            echo "====================================="
            echo "📍 Connected to Raspberry Pi"
            echo "Hostname:"
            hostname
            echo "User:"
            whoami
            echo "Uptime:"
            uptime
            echo "====================================="

            echo "📂 Switching to project directory"
            cd /srv/toolhub/tool-hub

            echo "📌 Git status (before)"
            git status
            git branch --show-current

            echo "⬇️ Fetching latest changes"
            git fetch --prune origin "${DEPLOY_BRANCH}"

            echo "🧹 Cleaning local workspace"
            git reset --hard
            git clean -fd

            echo "📌 Checking out ${DEPLOY_BRANCH}"
            git checkout -f "${DEPLOY_BRANCH}" || git checkout -B "${DEPLOY_BRANCH}"

            echo "🔄 Resetting to origin/${DEPLOY_BRANCH}"
            git reset --hard "origin/${DEPLOY_BRANCH}"

            echo "🧹 Cleaning untracked files after reset"
            git clean -fd

            echo "📌 Latest commit"
            git log -1 --oneline

            echo "====================================="
            echo "🐳 Docker Compose status (before)"
            docker compose ps
            echo "====================================="

            echo "🔨 Building and starting backend"
            docker compose build backend
            docker compose up -d backend

            echo "🔨 Building and starting frontend"
            docker compose build frontend
            docker compose up -d frontend

            echo "🔨 Building and starting scraper"
            docker compose build scraper-beautifulsoup
            docker compose up -d scraper-beautifulsoup

            echo "====================================="
            echo "🐳 Docker Compose status (after)"
            docker compose ps
            echo "====================================="

            echo "📜 Recent container logs (last 100 lines)"
            docker compose logs --tail=100
