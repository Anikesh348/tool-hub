version: "3.8"

services:
  frontend:
    build:
      context: ./frontend
      args:
        ENVIRONMENT: ${ENVIRONMENT}
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  backend:
    build:
      context: ./backend-python
    container_name: backend
    env_file:
      - ./backend/.env.dev
    environment:
      SCRAPPER_SEARCH_URL: http://scraper-beautifulsoup:8001/v2/search
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3

  scraper-beautifulsoup:
    build:
      context: ./scraper-beautifulsoup
    container_name: scraper-beautifulsoup
    ports:
      - "8001:8001"
    restart: always
